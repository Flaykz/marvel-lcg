services:
  marvel-lcg:
    image: ghcr.io/flaykz/marvel-lcg:latest
    container_name: marvel-lcg
    restart: unless-stopped
    ports:
      - "2345:2345"
    volumes:
      # Named volumes: Docker creates them automatically on first "up" and
      # seeds them with whatever the image already has at that path
      # (launch.json, the starter decks). No manual mkdir/touch needed.
      - launch:/app/launch.json   # edit later with: docker exec -it marvel-lcg vi launch.json
      - assets:/app/assets        # empty at first run, see README to fill it in
      - deck:/app/deck
      - replays:/app/replays
      - state:/app/state          # statistics.json + crash.log

volumes:
  launch:
  assets:
  deck:
  replays:
  state:
